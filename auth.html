<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mon compte · BudgetAI</title><link rel="stylesheet" href="assets/css/auth.css"></head><body><main><h1>BudgetAI</h1><p>Ton compte. Ton budget. Tous tes écrans.</p><h2 id="title">Me connecter</h2><form id="authForm"><label id="emailLabel">Adresse e-mail<input id="email" type="email" autocomplete="email" required maxlength="254"></label><label id="passwordLabel">Mot de passe<input id="password" type="password" autocomplete="current-password" minlength="12" maxlength="128" required></label><label id="consentLabel" hidden><input type="checkbox" id="consent"> J’autorise la transmission de mes relevés, opérations et questions à OpenRouter et au fournisseur du modèle pour les analyses IA. Je peux utiliser mon budget sans activer l’IA.</label><p id="error" role="alert"></p><p id="message" role="status"></p><button id="submit" type="submit">Me connecter</button></form><button id="switch" class="secondary">Créer un compte</button><button id="forgot" class="secondary">Mot de passe oublié</button><section id="pending" hidden><p>Ouvre le lien reçu par e-mail, puis reviens ici.</p><button id="check">J’ai confirmé mon adresse</button><button id="resend" class="secondary">Renvoyer l’e-mail</button><button id="logout" class="secondary">Me déconnecter</button></section></main><script src="assets/js/session.js"></script><script src="assets/js/auth.js"></script></body></html>
